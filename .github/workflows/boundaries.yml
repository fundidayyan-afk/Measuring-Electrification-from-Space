name: Download region boundaries

# Downloads DHS region shapes for each survey and saves them to the repo.
# Start it from the Actions tab with the "Run workflow" button.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rdhs
            any::sf

      - name: Download boundaries
        run: Rscript R/download_boundaries.R

      - name: Commit the boundaries to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/boundaries
          git commit -m "Add DHS region boundaries" || echo "No changes"
          git pull --rebase
          git push
