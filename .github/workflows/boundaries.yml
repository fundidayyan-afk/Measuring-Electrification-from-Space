name: Download region boundaries

# Downloads DHS region shapes for each survey and saves them to the repo.
# Start it from the Actions tab with the "Run workflow" button.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install pandas requests geopandas pyogrio

      - name: Download boundaries
        run: python src/download_boundaries.py

      - name: Commit the boundaries to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/boundaries
          git commit -m "Add DHS region boundaries" || echo "No changes"
          git pull --rebase
          git push
