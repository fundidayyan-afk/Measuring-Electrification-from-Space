name: Get preliminary numbers

# Runs the download scripts on GitHub's servers and saves the results.
# Start it from the Actions tab with the "Run workflow" button.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install pandas requests tabulate

      - name: Download World Bank data
        run: python src/download_worldbank.py

      - name: Download DHS data
        run: python src/download_dhs.py

      - name: Build preliminary summary
        run: |
          python src/preliminary_stats.py
          cat outputs/tables/preliminary_stats.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save raw files for download
        uses: actions/upload-artifact@v4
        with:
          name: raw-data
          path: data/raw/*.csv

      - name: Commit the results to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f outputs/tables/preliminary_stats.md data/raw/dhs_surveys.csv data/raw/worldbank_access.csv
          git commit -m "Update preliminary numbers from live data" || echo "No changes"
          git push
